name: Package and release

# A tag (v1.5.0) builds the addon's zip and uploads it to CurseForge and to a GitHub release
# (with release.json, which WowUp reads). The game flavor (WoW: Forever) comes from the .toc's
# Interface 16001.
on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
